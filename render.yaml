# Render.com 一键部署配置
# 用法：Render 新建 Blueprint / Web Service 时连本仓库，会自动读取此文件。
# Render 会自动注入 PORT 环境变量，server/src/index.ts 已读取 process.env.PORT。
services:
  - type: web
    name: zhajinhua
    runtime: node
    plan: free
    region: oregon            # 可选：auto / oregon / frankfurt / singapore
    branch: main              # 若你的默认分支是 master，改这里
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: npm --prefix server start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        sync: false           # Render 自动分配；不要写死
